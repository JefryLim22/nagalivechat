<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workspace — NagaLiveChat</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="app">
  <div class="shell">
    <!-- Rail navigasi -->
    <nav class="rail" aria-label="Navigasi workspace">
      <a class="rail-brand" href="/" title="NagaLiveChat" aria-label="Beranda NagaLiveChat">
        <svg viewBox="0 0 40 40" fill="none"><defs><linearGradient id="rb" x1="0" y1="0" x2="40" y2="40">
          <stop stop-color="#8B7CFA"/><stop offset=".55" stop-color="#6D5EF8"/><stop offset="1" stop-color="#FF7A45"/>
        </linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#rb)"/>
        <path d="M12 14.5A3.5 3.5 0 0 1 15.5 11h9a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-3.5 3.5h-5.2l-4.6 3.6a.8.8 0 0 1-1.3-.63V24H15.5A3.5 3.5 0 0 1 12 20.5v-6Z" fill="#fff"/></svg>
      </a>
      <div class="rail-nav" id="railNav"></div>
      <div class="rail-foot">
        <button class="presence-btn" id="presenceBtn" aria-label="Ubah status kehadiran">
          <span class="avatar" id="meAvatar">··</span>
          <span class="status-dot"></span>
        </button>
        <div class="rail-menu" id="railMenu">
          <div class="rm-head"><b id="meName">—</b><span id="meEmail">—</span></div>
          <button data-presence="online"><i style="background:#12B886"></i> Online — siap menerima chat</button>
          <button data-presence="away"><i style="background:#F5A524"></i> Away — sedang sibuk</button>
          <button data-presence="offline"><i style="background:#B4BBCD"></i> Offline — tidak menerima chat</button>
          <hr class="divider" style="margin:6px 0">
          <button data-action="profile">⚙️ Pengaturan akun</button>
          <button data-action="logout" class="danger">↪ Keluar</button>
        </div>
      </div>
    </nav>

    <div class="main" id="main">
      <div class="view"><div class="view-scroll"><div class="empty-state"><div class="spinner spinner-dark" style="margin:0 auto"></div></div></div></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalHost"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/assets/js/app/main.js"></script>
</body>
</html>

# Deploy otomatis ke VPS setiap kali ada push ke branch utama.
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   SSH_HOST         IP atau hostname server
#   SSH_USER         naga
#   SSH_KEY          private key OpenSSH milik pengguna tersebut
#   SSH_KNOWN_HOSTS  keluaran `ssh-keyscan -t ed25519 <IP server>`
#   SSH_PORT         (opsional) port SSH bila bukan 22
#
# Variable opsional (Settings → Secrets and variables → Actions → Variables):
#   PUBLIC_URL       URL publik situs; default https://nagalivechat.shop
#   APP_DIR          Lokasi kode di server; default /opt/nagalivechat
#                    (aaPanel biasanya /www/wwwroot/nagalivechat.shop)

name: Deploy ke VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Deploy berurutan: push beruntun tidak akan saling menimpa di server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://nagalivechat.shop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Periksa sintaks server sebelum dikirim
        run: |
          for file in $(find server public/assets/js public/widget.js -name '*.js'); do
            node --check "$file" || exit 1
          done
          echo "Semua berkas JavaScript lolos pemeriksaan sintaks."

      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key dipasang dari secret, bukan diterima begitu saja,
          # agar deploy tidak bisa dibajak lewat man-in-the-middle.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Jalankan deploy di server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/nagalivechat' }}
        run: |
          # Perintah dirakit lebih dulu agar kutipnya jelas saat dikirim lewat ssh.
          REMOTE_CMD="APP_DIR='${APP_DIR}' BRANCH='${GITHUB_REF_NAME}' '${APP_DIR}/deploy/deploy.sh'"
          echo "Menjalankan di server: $REMOTE_CMD"
          ssh -i ~/.ssh/id_deploy \
              -p "${SSH_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "$REMOTE_CMD"

      - name: Verifikasi dari luar
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://nagalivechat.shop' }}
        run: |
          for i in $(seq 1 6); do
            if curl -fsS --max-time 10 "$PUBLIC_URL/api/health"; then
              echo ""
              echo "Situs sehat dan dapat diakses publik di $PUBLIC_URL"
              exit 0
            fi
            echo "Belum merespons, mencoba lagi ($i/6)…"
            sleep 5
          done
          echo "Situs tidak merespons dari luar — periksa nginx, DNS, atau SSL." >&2
          exit 1

      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/id_deploy

# ============================================================================
# Konfigurasi reverse proxy NagaLiveChat untuk aaPanel / BT Panel
#
# CARA PAKAI
#   aaPanel → Website → klik domain Anda → Config File
#   Tempel isi berkas ini MENGGANTIKAN seluruh isi blok server { … },
#   sesuaikan bagian yang ditandai, lalu Save.
#
# Ganti:
#   __DOMAIN__   → nagalivechat.shop
#   __PORT__     → 3000 (atau port yang Anda pakai di .env)
#
# PENTING — dua blok berikut ADA di template bawaan aaPanel dan HARUS dihapus:
#
#     location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; }
#     location ~ .*\.(js|css)?$                  { expires 12h; }
#
# Di nginx, location regex ( ~ ) selalu menang atas location prefix ( / ).
# Akibatnya seluruh file .js dan .css — termasuk /widget.js — akan dicari di
# folder situs yang kosong dan mengembalikan 404: halaman tampil tanpa gaya
# dan widget tidak berfungsi sama sekali.
# ============================================================================

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Aplikasi Node yang menyajikan semuanya; folder situs tidak dipakai.
    index index.html;
    root /www/wwwroot/__DOMAIN__;

    # --- Socket.IO: WAJIB, tanpa ini chat tidak realtime -------------------
    # "^~" memastikan blok ini menang atas location regex mana pun.
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Koneksi WebSocket berumur panjang; jangan diputus nginx.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # --- Seluruh aplikasi --------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Blokir akses ke berkas sensitif bila ada yang tersimpan di folder situs.
    # "(/|$)" penting: tanpa itu hanya /.git/config yang tertangkap,
    # sedangkan /.env sendiri lolos.
    location ~ ^/(\.env|\.git|node_modules|data)(/|$) {
        deny all;
        return 404;
    }

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log  /www/wwwlogs/__DOMAIN__.error.log;

    # Certbot / aaPanel akan menambahkan blok SSL di bawah ini saat
    # Anda mengaktifkan Let's Encrypt lewat panel.
}
